# Dependency manifest for the Python state server — the single source of truth
# for what this deployable depends on. Mirrors app/client-web/package.json on the
# other half of the repo: this file states intent (compatible version ranges),
# and the committed uv.lock beside it pins the exact resolved versions of the
# full transitive closure, with hashes.
#
# Add or change a dependency by editing this file, then run `uv lock` (from this
# directory) and commit both files together.

[project]
name = "pswamp-server"
version = "0.1.0"
description = "P-SWAMP state server: WebSocket timeline backend."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.6,<0.116",
    "uvicorn[standard]>=0.34,<0.35",
]

# Tooling that must never ship in the image — the Dockerfile installs with
# --no-dev. Declared here so the linter version is locked and hash-verified like
# everything else, and defined in exactly one place rather than duplicated across
# the two scripts that invoke it.
[dependency-groups]
dev = ["ruff==0.16.2"]

# Not an installable package: src/ is a plain source folder that the process runs
# from, not a packaging layout. src/server.py is the one entrypoint and imports
# each app package by name (`import timeline`), which resolves because the working
# directory is src/ — locally via `uv run src/server.py`, and in the image via
# WORKDIR /app/src. Inside an app package the modules use relative imports
# (timeline/api.py does `from .model import ...`), so a package can be moved or
# renamed without touching its internals. uv manages the dependencies and the venv
# only — it builds no wheel — so adding a backend api is just a new folder under
# src/, with no manifest change.
#
# Deliberately no [tool.ruff] section: ruff treats a pyproject.toml as config only
# when one is present, and the explicit `--select E,F` in scripts/error_check.sh is
# meant to stay authoritative (see the note there about not inheriting ruff's
# opinionated defaults).
[tool.uv]
package = false
