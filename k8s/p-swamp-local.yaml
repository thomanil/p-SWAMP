# Local minikube deployment of the p-swamp client-server stack (the FastAPI
# state server, with the web client baked in and served from the same origin).
#
# Single replica on purpose: the server holds per-client state in memory — one
# pipeline per connected client (src/pmu_test_streamer/api.py, pswamp_web/hub.py)
# — so it must never be scaled past 1 — a second pod would have its own independent state and
# the Service would split clients across them. The strategy is Recreate (not the
# default RollingUpdate) so the old pod is gone before the new one serves, for
# the same reason.
#
# Nothing is persisted: no DB, no persistent volumes. A rollout resets every
# client's state, which is the expected behavior for this stateless deployment.
# The volumes below are a read-only ConfigMap (configuration, not storage) and
# the broker's emptyDir (scratch that dies with its pod, on purpose).
#
# Three Deployments: the server; the PMU test streamer's stats module as its
# own pod (p-swamp-stats-worker, the same image with a different command); and
# the Apache Kafka broker between them. The module runs in the worker because the
# server's env block says so (PMU_TEST_STREAMER_MODULE_TRANSPORT); drop those
# two variables and the module runs in the server pod, with nothing else
# changed. See "Running a module as a separate service" in
# doc/server-data-architecture.md.
#
# The PMU data sources are configured here rather than baked in. The env block
# names the two providers (the streamer's own default, spelled out) and points
# the live feed at k8s/deployment_pmu_data_file_example.txt, which the start
# script turns into the ConfigMap mounted below — a file that is NOT in the
# image, which is the point: it shows a deployment feeding the server its own
# data with nothing but a variable and a mount. In that file every value counts
# up by one per frame from a round start (100 kV, 0°, 60 Hz), the same in every
# station, so a page switched to Live shows at a glance both that the
# k8s-configured source is what is feeding it and that it is moving, while
# Recorded still replays the recording shipped in the image.
#
# Apply with scripts/start-pswamp-in-local-minikube-cluster.sh, which builds the image straight into
# minikube and forces a rollout. Clients reach this over the NodePort at
# ws://<minikube-ip>:30080/api/time-window/ws (and the web client is served from
# the same port).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p-swamp
  labels:
    app: p-swamp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: p-swamp
  template:
    metadata:
      labels:
        app: p-swamp
    spec:
      # Matches the non-root user baked into the image (useradd --uid 10001 app).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: p-swamp
          image: p-swamp:latest
          # Use the image built into minikube; never try to pull from a registry.
          # With the :latest tag the default policy would be Always, which would
          # fail with ImagePullBackOff since this image only exists locally.
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          env:
            # Bind on all interfaces inside the pod. PORT defaults to 8000 via
            # the Dockerfile's ENV, so it's not repeated here.
            - name: HOST
              value: "0.0.0.0"
            # Which providers make up each client's gateway: name:module:Class,
            # comma-separated (doc/server-data-architecture.md, "Providers").
            # This is the streamer's built-in default; a deployment's own
            # provider is one more package in the image and one more entry here.
            - name: PSWAMP_DATA_CLIENTS
              value: "sample:pmu_test_streamer.sample_client:SampleRecordingClient,live:pmu_test_streamer.live_client:LiveSyntheticClient"
            # Each provider reads its own {NAME}_{SETTING} block. The live feed
            # cycles the rows of this file instead of the image's sample_data.txt.
            # It must keep the recording's channel layout (the same five stations
            # at 20 Hz): the live client serves no header, so the recording's
            # header is what describes its frames.
            - name: LIVE_PATH
              value: /etc/p-swamp/pmu/deployment_pmu_data_file_example.txt
            # The stats module runs in the p-swamp-stats-worker pod, reached
            # over the p-swamp-kafka broker: each client's pipeline then
            # holds a RemoteModule that publishes frames on the module's input
            # topic under the client's key and tails the results back. The
            # worker reads the same two variables.
            - name: PMU_TEST_STREAMER_MODULE_TRANSPORT
              value: kafka:pswamp_core.transport.kafka:KafkaTransport
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: p-swamp-kafka:9092
          volumeMounts:
            - name: pmu-data
              mountPath: /etc/p-swamp/pmu
              readOnly: true
          # Both probes hit /healthz: with no external dependencies there is
          # nothing readiness could check that liveness doesn't. Readiness still
          # earns its keep by holding the pod out of the Service until the app
          # is actually answering.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              # NOTE: deliberately roomy for such a tiny workload. This minikube
              # node runs as a Docker container inside an aarch64 Linux VM that is
              # itself nested on a Mac. Under that double virtualization each
              # instruction is slower, so the small per-tick work (5 ticks/s:
              # step + serialize + WS send) overruns a 25ms/100ms CFS budget and
              # the event loop gets throttled in ~2/3 of periods — playback
              # visibly crawls. Confirmed via the pod's cgroup cpu.stat
              # (nr_throttled climbing). A roomier limit keeps the timer wakeups
              # on time. This is a local-only test manifest, so the extra
              # headroom costs nothing and never ships.
              cpu: "2"
              # Memory is sized from MAX_PIPELINES, not from typical load. Each
              # connected client gets its own PMU replay (~30 MB and four threads,
              # see pswamp_web/hub.py), and freed memory is not returned to the OS
              # — so peak RSS tracks the cap: ~100 MB base + 8 x 30 MB, plus room
              # for the transient double allocation while a pipeline starts.
              # This was 128Mi when one pipeline served the whole process, which
              # does not fit even a single client under the new arrangement.
              memory: "768Mi"
      volumes:
        # Built by scripts/start-pswamp-in-local-minikube-cluster.sh from
        # k8s/deployment_pmu_data_file_example.txt (kubectl create configmap
        # --from-file). Not inlined here, so the data stays a plain text file.
        - name: pmu-data
          configMap:
            name: p-swamp-pmu-data
---
apiVersion: v1
kind: Service
metadata:
  name: p-swamp
  labels:
    app: p-swamp
spec:
  type: NodePort
  selector:
    app: p-swamp
  ports:
    - name: http
      protocol: TCP
      port: 8000        # cluster-internal Service port
      targetPort: 8000  # container port
      nodePort: 30080   # fixed external port (valid range 30000-32767)
---
# The stats module as its own pod: the same image with a different command
# (src/pmu_test_streamer/worker.py). No port and no Service: it tails pmu.frame
# off the broker below, runs one FrameStatsModule per client key it sees, and
# publishes frame.stats.result back under that key. One replica because the
# host owns every key it sees; two workers would each answer every frame.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p-swamp-stats-worker
  labels:
    app: p-swamp-stats-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: p-swamp-stats-worker
  template:
    metadata:
      labels:
        app: p-swamp-stats-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: stats-worker
          image: p-swamp:latest
          imagePullPolicy: Never
          command: ["python", "-m", "pmu_test_streamer.worker"]
          env:
            - name: PMU_TEST_STREAMER_MODULE_TRANSPORT
              value: kafka:pswamp_core.transport.kafka:KafkaTransport
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: p-swamp-kafka:9092
          # No probes: nothing routes here (no readiness), and the process
          # exits when it cannot serve, which restarts the pod. A liveness
          # probe that could tell an idle worker from a stuck one would need
          # the worker to expose something; recorded as open in STEP 5.
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              # See the server's note on CPU: the same nested-virtualization
              # throttling applies to a 20 Hz loop here.
              cpu: "1"
              # The same import graph as the server but no replay pipeline:
              # one module per client key, one consumer per topic.
              memory: "512Mi"
---
# The broker between the server and the stats-worker: Apache Kafka, the
# official image (Apache 2.0), one node in KRaft mode. The ONE image here that
# is pulled rather than built into minikube -- hence IfNotPresent, not the
# Never the p-swamp image needs -- so the first rollout waits for a download
# (the start script gives it the longer timeout). Its log dir is an emptyDir:
# ephemeral by the "no persistent volume" rule, and fine, since everything on
# its topics is a live hop the server re-primes. Auto-creation is off; the
# transport creates its topics with the right config.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p-swamp-kafka
  labels:
    app: p-swamp-kafka
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: p-swamp-kafka
  template:
    metadata:
      labels:
        app: p-swamp-kafka
    spec:
      # The image's own `appuser`.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: kafka
          image: apache/kafka:4.3.1
          imagePullPolicy: IfNotPresent
          # Every KAFKA_* variable becomes a server.properties entry.
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://p-swamp-kafka:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
            - name: KAFKA_HEAP_OPTS
              value: -Xmx512m -Xms256m
          ports:
            - name: kafka
              containerPort: 9092
          # The broker's own CLI asking for its api versions: a JVM start per
          # probe, hence the long timeout and period.
          readinessProbe:
            exec:
              command:
                - /opt/kafka/bin/kafka-broker-api-versions.sh
                - --bootstrap-server
                - localhost:9092
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /opt/kafka/bin/kafka-broker-api-versions.sh
                - --bootstrap-server
                - localhost:9092
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: p-swamp-kafka
  labels:
    app: p-swamp-kafka
spec:
  type: ClusterIP
  selector:
    app: p-swamp-kafka
  ports:
    - name: kafka
      protocol: TCP
      port: 9092
      targetPort: 9092
