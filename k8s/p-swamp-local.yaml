# Local minikube deployment of the p-swamp client-server stack (the FastAPI
# state server, with the web client baked in and served from the same origin).
#
# Single replica on purpose: the server holds per-client state in memory — one
# pipeline per connected client (src/pmu_test_streamer/api.py, pswamp_web/hub.py)
# — so it must never be scaled past 1 — a second pod would have its own independent state and
# the Service would split clients across them. The strategy is Recreate (not the
# default RollingUpdate) so the old pod is gone before the new one serves, for
# the same reason.
#
# Nothing is persisted: no DB, no persistent volumes. A rollout resets every
# client's state, which is the expected behavior for this stateless deployment.
# The volumes below are a read-only ConfigMap (configuration, not storage) and
# the broker's emptyDir (a scratch disk that dies with its pod, on purpose).
#
# The PMU data sources are configured here rather than baked in. The env block
# names the two providers (the streamer's own default, spelled out) and points
# the live feed at k8s/deployment_pmu_data_file_example.txt, which the start
# script turns into the ConfigMap mounted below — a file that is NOT in the
# image, which is the point: it shows a deployment feeding the server its own
# data with nothing but a variable and a mount. In that file every value counts
# up by one per frame from a round start (100 kV, 0°, 60 Hz), the same in every
# station, so a page switched to Live shows at a glance both that the
# k8s-configured source is what is feeding it and that it is moving, while
# Recorded still replays the recording shipped in the image.
#
# Apply with scripts/start-pswamp-in-local-minikube-cluster.sh, which builds the image straight into
# minikube and forces a rollout. Clients reach this over the NodePort at
# ws://<minikube-ip>:30080/api/time-window/ws (and the web client is served from
# the same port).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p-swamp
  labels:
    app: p-swamp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: p-swamp
  template:
    metadata:
      labels:
        app: p-swamp
    spec:
      # Matches the non-root user baked into the image (useradd --uid 10001 app).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: p-swamp
          image: p-swamp:latest
          # Use the image built into minikube; never try to pull from a registry.
          # With the :latest tag the default policy would be Always, which would
          # fail with ImagePullBackOff since this image only exists locally.
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          env:
            # Bind on all interfaces inside the pod. PORT defaults to 8000 via
            # the Dockerfile's ENV, so it's not repeated here.
            - name: HOST
              value: "0.0.0.0"
            # Which providers make up each client's gateway: name:module:Class,
            # comma-separated (doc/server-data-architecture.md, "Providers").
            # This is the streamer's built-in default; a deployment's own
            # provider is one more package in the image and one more entry here.
            - name: PSWAMP_DATA_CLIENTS
              value: "sample:pmu_test_streamer.sample_client:SampleRecordingClient,live:pmu_test_streamer.live_client:LiveSyntheticClient"
            # Each provider reads its own {NAME}_{SETTING} block. The live feed
            # cycles the rows of this file instead of the image's sample_data.txt.
            # It must keep the recording's channel layout (the same five stations
            # at 20 Hz): the live client serves no header, so the recording's
            # header is what describes its frames.
            - name: LIVE_PATH
              value: /etc/p-swamp/pmu/deployment_pmu_data_file_example.txt
            # Reach the frequency-peek module over the broker (the
            # p-swamp-redpanda Deployment below) instead of running it in this
            # pod: the pipeline then holds a TopicBridge producing frames onto
            # the broker's topics and tailing the results the worker pod
            # produces. Remove these two and the module runs in-process.
            - name: FREQUENCY_PEEK_BUS_CLIENTS
              value: bus:pswamp_core.datagateway.clients.kafka:KafkaClient
            - name: BUS_BOOTSTRAP_SERVERS
              value: p-swamp-redpanda:9092
          volumeMounts:
            - name: pmu-data
              mountPath: /etc/p-swamp/pmu
              readOnly: true
          # Both probes hit /healthz: with no external dependencies there is
          # nothing readiness could check that liveness doesn't. Readiness still
          # earns its keep by holding the pod out of the Service until the app
          # is actually answering.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              # NOTE: deliberately roomy for such a tiny workload. This minikube
              # node runs as a Docker container inside an aarch64 Linux VM that is
              # itself nested on a Mac. Under that double virtualization each
              # instruction is slower, so the small per-tick work (5 ticks/s:
              # step + serialize + WS send) overruns a 25ms/100ms CFS budget and
              # the event loop gets throttled in ~2/3 of periods — playback
              # visibly crawls. Confirmed via the pod's cgroup cpu.stat
              # (nr_throttled climbing). A roomier limit keeps the timer wakeups
              # on time. This is a local-only test manifest, so the extra
              # headroom costs nothing and never ships.
              cpu: "2"
              # Memory is sized from MAX_PIPELINES, not from typical load. Each
              # connected client gets its own PMU replay (~30 MB and four threads,
              # see pswamp_web/hub.py), and freed memory is not returned to the OS
              # — so peak RSS tracks the cap: ~100 MB base + 8 x 30 MB, plus room
              # for the transient double allocation while a pipeline starts.
              # This was 128Mi when one pipeline served the whole process, which
              # does not fit even a single client under the new arrangement.
              memory: "768Mi"
      volumes:
        # Built by scripts/start-pswamp-in-local-minikube-cluster.sh from
        # k8s/deployment_pmu_data_file_example.txt (kubectl create configmap
        # --from-file). Not inlined here, so the data stays a plain text file.
        - name: pmu-data
          configMap:
            name: p-swamp-pmu-data
---
apiVersion: v1
kind: Service
metadata:
  name: p-swamp
  labels:
    app: p-swamp
spec:
  type: NodePort
  selector:
    app: p-swamp
  ports:
    - name: http
      protocol: TCP
      port: 8000        # cluster-internal Service port
      targetPort: 8000  # container port
      nodePort: 30080   # fixed external port (valid range 30000-32767)
---
# The frequency-peek module as its own pod: the same image with a different
# command (src/frequency_peek/worker.py). It has no port and no Service: it
# tails pmu.frame off the broker below and produces frequency.result back,
# through the core's TopicBridge, so the module code is unchanged and nothing
# addresses this pod. One replica because one module instance is the design
# (the analysis runs once for the shared live stream), not a transport limit.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p-swamp-frequency-worker
  labels:
    app: p-swamp-frequency-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: p-swamp-frequency-worker
  template:
    metadata:
      labels:
        app: p-swamp-frequency-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: frequency-worker
          image: p-swamp:latest
          imagePullPolicy: Never
          command: ["python", "-m", "frequency_peek.worker"]
          env:
            - name: FREQUENCY_PEEK_BUS_CLIENTS
              value: bus:pswamp_core.datagateway.clients.kafka:KafkaClient
            - name: BUS_BOOTSTRAP_SERVERS
              value: p-swamp-redpanda:9092
          # Liveness is a heartbeat file the worker touches every 5 s while its
          # loop runs; "fresh within 30 s" is the whole check. A lost broker is
          # reconnected by the bridge and would not be fixed by a restart, so
          # it does not fail this. No readiness probe: nothing routes to it.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - test $(( $(date +%s) - $(stat -c %Y /tmp/frequency-worker-heartbeat) )) -lt 30
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              # See the server's note on CPU: the same nested-virtualization
              # throttling applies to a 20 Hz loop here.
              cpu: "1"
              # The worker imports the same stack as the server but builds no
              # replay pipeline: one module, one bridge, two consumers.
              memory: "512Mi"
---
# The broker the frequency-peek module is reached through: Redpanda, a
# single-binary Kafka-API server, one node in dev-container mode. This is the
# ONE image here that is pulled rather than built into minikube -- hence
# IfNotPresent, not the Never the p-swamp image needs -- so the first rollout
# waits for a download (the start script gives it the longer timeout). Its
# data dir is an emptyDir: ephemeral by the "no persistent volume" rule, and
# fine, since everything on the topics is a live stream the web server
# re-primes. Topics are created by the clients on first use.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p-swamp-redpanda
  labels:
    app: p-swamp-redpanda
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: p-swamp-redpanda
  template:
    metadata:
      labels:
        app: p-swamp-redpanda
    spec:
      # The image's own `redpanda` user.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v26.2.2
          imagePullPolicy: IfNotPresent
          args:
            - redpanda
            - start
            - --mode
            - dev-container
            - --smp
            - "1"
            - --memory
            - 512M
            - --reserve-memory
            - 0M
            - --overprovisioned
            - --kafka-addr
            - internal://0.0.0.0:9092
            - --advertise-kafka-addr
            - internal://p-swamp-redpanda:9092
          ports:
            - name: kafka
              containerPort: 9092
            - name: admin
              containerPort: 9644
          readinessProbe:
            httpGet:
              path: /v1/status/ready
              port: 9644
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /v1/status/ready
              port: 9644
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/redpanda/data
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: p-swamp-redpanda
  labels:
    app: p-swamp-redpanda
spec:
  type: ClusterIP
  selector:
    app: p-swamp-redpanda
  ports:
    - name: kafka
      protocol: TCP
      port: 9092
      targetPort: 9092
    - name: admin
      protocol: TCP
      port: 9644
      targetPort: 9644
