# Local minikube deployment of the p-swamp client-server stack (the FastAPI
# state server, with the web client baked in and served from the same origin).
#
# Single replica on purpose: the server holds per-client state in memory (each
# client's selected broker, play flag and metrics, plus its own broker consumer —
# see src/pmu_test_streamer/api.py), so it must never be scaled past 1 — a second
# pod would have its own independent state and the Service would split clients
# across them. The strategy is Recreate (not the default RollingUpdate) so the old
# pod is gone before the new one serves, for the same reason.
#
# Nothing is persisted: no DB, no volumes. A rollout resets every client's state,
# which is the expected behavior for this stateless deployment.
#
# Apply with scripts/start-pswamp-in-local-minikube-cluster.sh, which builds the image straight into
# minikube and forces a rollout. Clients reach this over the NodePort at
# ws://<minikube-ip>:30080/api/time-window/ws (and the web client is served from
# the same port).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p-swamp
  labels:
    app: p-swamp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: p-swamp
  template:
    metadata:
      labels:
        app: p-swamp
    spec:
      # Matches the non-root user baked into the image (useradd --uid 10001 app).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: p-swamp
          image: p-swamp:latest
          # Use the image built into minikube; never try to pull from a registry.
          # With the :latest tag the default policy would be Always, which would
          # fail with ImagePullBackOff since this image only exists locally.
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          env:
            # Bind on all interfaces inside the pod. PORT defaults to 8000 via
            # the Dockerfile's ENV, so it's not repeated here.
            - name: HOST
              value: "0.0.0.0"
            # Kafka-vs-NATS experiment: where the per-client consumers reach the
            # two brokers (the Services defined below). The server still boots
            # without them — consumers connect lazily and report a down pipe — so
            # readiness stays /healthz and this Deployment has no broker dependency.
            - name: KAFKA_BOOTSTRAP
              value: "kafka:9092"
            - name: NATS_URL
              value: "nats://nats:4222"
          # Both probes hit /healthz: with no external dependencies there is
          # nothing readiness could check that liveness doesn't. Readiness still
          # earns its keep by holding the pod out of the Service until the app
          # is actually answering.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              # NOTE: deliberately roomy for such a tiny workload. This minikube
              # node runs as a Docker container inside an aarch64 Linux VM that is
              # itself nested on a Mac. Under that double virtualization each
              # instruction is slower, so the small per-tick work (5 ticks/s:
              # step + serialize + WS send) overruns a 25ms/100ms CFS budget and
              # the event loop gets throttled in ~2/3 of periods — playback
              # visibly crawls. Confirmed via the pod's cgroup cpu.stat
              # (nr_throttled climbing). A roomier limit keeps the timer wakeups
              # on time. This is a local-only test manifest, so the extra
              # headroom costs nothing and never ships.
              cpu: "2"
              # Memory is sized from MAX_PIPELINES, not from typical load. Each
              # connected client gets its own PMU replay (~30 MB and four threads,
              # see pswamp_web/hub.py), and freed memory is not returned to the OS
              # — so peak RSS tracks the cap: ~100 MB base + 8 x 30 MB, plus room
              # for the transient double allocation while a pipeline starts.
              # This was 128Mi when one pipeline served the whole process, which
              # does not fit even a single client under the new arrangement.
              memory: "768Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: p-swamp
  labels:
    app: p-swamp
spec:
  type: NodePort
  selector:
    app: p-swamp
  ports:
    - name: http
      protocol: TCP
      port: 8000        # cluster-internal Service port
      targetPort: 8000  # container port
      nodePort: 30080   # fixed external port (valid range 30000-32767)
---
# --- Kafka-vs-NATS experiment (branch kafka-nats-experiments) -----------------
#
# The pub/sub transfer layer, mirroring docker-compose.yml: a producer loops the
# PMU sample into both brokers, the server consumes whichever pipe a client picks.
# All ephemeral (emptyDir, no PersistentVolumes) — nothing here is persisted, in
# keeping with the stateless deployment. Kept in this one file so the minikube
# script's single `kubectl apply -f k8s/p-swamp-local.yaml` picks it up.
#
# NATS: one small server, the whole broker. -m 8222 enables the monitoring
# endpoint used by the probes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  labels:
    app: nats
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: nats:2.10-alpine
          args: ["-m", "8222"]
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8222
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8222
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  labels:
    app: nats
spec:
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
---
# Kafka: single-node KRaft (no ZooKeeper), combined broker+controller. The env
# block below is the minimum a single node needs — that surface, against NATS's
# one flag above, is the ops-complexity half of the experiment. emptyDir: the log
# dir is ephemeral, so a pod restart is a fresh broker (fine for a live replay).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  labels:
    app: kafka
spec:
  replicas: 1
  strategy:
    type: Recreate  # single writer to the (ephemeral) log dir
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          ports:
            - name: client
              containerPort: 9092
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka:9093"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
          volumeMounts:
            - name: kafka-logs
              mountPath: /var/lib/kafka/data
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
      volumes:
        - name: kafka-logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app: kafka
spec:
  # Headless so the advertised name "kafka:9092" resolves to the pod directly —
  # a single-broker KRaft node advertises its own hostname to clients.
  clusterIP: None
  # A single-node KRaft broker must resolve its OWN advertised/quorum hostname
  # ("kafka") at startup to bootstrap the controller quorum — but it can't pass
  # its readiness probe until 9092 is listening, which doesn't happen until the
  # quorum forms. By default a headless Service publishes DNS only for READY
  # endpoints, so "kafka" is NXDOMAIN during boot → the node dies with
  # UnknownHostException: kafka and crash-loops forever. Publishing not-ready
  # addresses breaks that deadlock: the pod's DNS record exists from the start.
  # (Docker Compose has no equivalent gate — its embedded DNS resolves a service
  # name to the container immediately — which is why this only bites in minikube.)
  publishNotReadyAddresses: true
  selector:
    app: kafka
  ports:
    - name: client
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
---
# Producer: the same p-swamp image as the server, different entrypoint. Built into
# minikube (imagePullPolicy: Never); retries its broker connects, so no init gate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
  labels:
    app: producer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: producer
  template:
    metadata:
      labels:
        app: producer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: producer
          image: p-swamp:latest
          imagePullPolicy: Never
          command: ["python", "producer.py"]
          env:
            - name: KAFKA_BOOTSTRAP
              value: "kafka:9092"
            - name: NATS_URL
              value: "nats://nats:4222"
            # - name: PRODUCER_RATE_HZ
            #   value: "100"   # raise to stress the brokers
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
