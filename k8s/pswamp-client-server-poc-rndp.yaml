#
# PoC deployment for the "pswamp-client-server-poc" project.
#
# Namespace ..... rndp-pswamp-client-server-poc
#                 Created by the rndp/auth chart from the project entry in
#                 environ/development/users.yaml -- it does not exist until
#                 that chart has been redeployed.
# Image ......... ghcr.io/thomanil/pswamp-client-server-poc:latest
#                 Left as ghcr.io on purpose: Kyverno rewrites it to the Harbor
#                 proxy at admission (config/kyverno/container-registry.yaml).
# External URL .. https://rndpdevsvc.statnett.no/pswamp-client-server-poc/
#
# Deploy:
#   kubectl apply -f pswamp-client-server-poc.yaml
#   (--namespace is redundant?, the namespace is set on each object below)
#
# Deliberately omitted for a PoC, add if/when needed:
#   - securityContext (see docs/k8s/workloads.md) -- not enforced by Kyverno in
#     project namespaces, and pinning a wrong uid is worse than pinning none
#   - probes -- only useful with a real health endpoint
#
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pswamp-client-server-poc
  namespace: rndp-pswamp-client-server-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pswamp-client-server-poc
  template:
    metadata:
      labels:
        app: pswamp-client-server-poc
    spec:
      nodeSelector:
        group: frontend # Fine for now, but since node of actual pswamp rig later on will also include backend eg the heavy bit, maybe it should be something different then
      containers:
        - name: pswamp
          image: ghcr.io/thomanil/pswamp-client-server-poc:latest
          ports:
            # uvicorn in this image listens on 8000. The Service maps its own
            # port 80 to this one via the symbolic name "http", so only this
            # number needs changing if the app moves port.
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: pswamp-client-server-poc
  namespace: rndp-pswamp-client-server-poc
spec:
  selector:
    app: pswamp-client-server-poc
  ports:
    - port: 80
      targetPort: http

---
# Reverse-proxy ingress with prefix rewriting:
#   https://rndpdevsvc.statnett.no/pswamp-client-server-poc/foo -> <service>:80/foo
#
# The app receives "/foo", not "/pswamp-client-server-poc/foo", so any absolute
# URL it generates (css, js, redirects) will 404 unless it is told its base path.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pswamp-client-server-poc
  namespace: rndp-pswamp-client-server-poc
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: services
  rules:
    - host: rndpdevsvc.statnett.no
      http:
        paths:
          - path: /pswamp-client-server-poc(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: pswamp-client-server-poc
                port:
                  number: 80
