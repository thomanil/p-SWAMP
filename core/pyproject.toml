# pswamp-core: the shared data architecture (messages, transport, modules,
# gateway, player, pipeline). pydantic is its only default dependency, so a
# provider or module written outside this repo can import the contract and
# nothing else.
#
# The third Python project in the repo, beside the desktop package (root
# pyproject.toml) and the web backend (app/server-python/pyproject.toml), which
# consumes it as an editable path dependency. No lockfile here: its tests run
# in the web backend's locked environment (scripts/run-python-server-tests.sh).

[project]
name = "pswamp-core"
version = "0.1.0"
description = "p-SWAMP shared data architecture: messages, transport, modules, gateway, player, pipeline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12",
]

# Optional, imported lazily, so the core stays pydantic-only unless a host asks:
# [kafka] is aiokafka, for pswamp_core.transport.kafka; [remote-data] is httpx,
# for pswamp_core.datagateway.clients.remote_data.
[project.optional-dependencies]
kafka = ["aiokafka>=0.14,<1"]
remote-data = ["httpx>=0.28,<1"]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pswamp_core"

# Deliberately no [tool.ruff] section: scripts/error_check.sh passes an explicit
# `--select F`, and ruff would otherwise treat this file as config.

# So `pytest core/tests` also works when pointed at directly.
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
