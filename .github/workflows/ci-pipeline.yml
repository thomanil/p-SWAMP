# Build the deployable container image and publish it to GitHub Container
# Registry (GHCR).
#
# Four jobs, in order:
#
#   static-errorcheck — runs scripts/error_check.sh, the same gate
#               .githooks/pre-push runs locally. CI calls the script rather than
#               reimplementing the checks in YAML, so the two can never drift
#               apart.
#   unit-tests — runs the Python test suites via the runner scripts
#   e2e-smoke-test — builds the image, runs it, and drives the Reference example
#               end to end (scripts/e2e-smoke-test.sh). The static and unit-test
#               jobs never start the app; this is the half that only starts it.
#   build     — builds Dockerfile (web client + server, one image) for amd64 and
#               pushes it to ghcr.io/<owner>/<repo>. Gated on all above, so a
#               failing check, a failing test, or a server that cannot serve
#               produces no image.
#
# What runs where:
#
#   pull request / branch    static-errorcheck + unit-tests + e2e-smoke-test.
#                            NOTHING is published.
#
# A branch with no PR open runs nothing: the push trigger is limited to main, so
# that work is gated through its pull request rather than twice over.
#
# Blocking a merge on these gates is a REPO SETTING, not something this file can
# express: Settings → Branches → branch protection for main → "Require status
# checks to pass", selecting `static-errorcheck`, `unit-tests` and `e2e-smoke-test`.
# (`unit-tests` is the new gate — add it to the required set, or a PR could merge
# with a failing test.) Those rules match on the JOB name, so renaming a job here
# silently un-requires it there — rename both together. Note the pull_request
# trigger below deliberately carries no paths filter, for a reason that follows
# directly from those checks being required — see the comment on it.
#
# Pulling what this publishes:
#   docker pull ghcr.io/<owner>/p-swamp:latest
#
# NOTE: a newly created GHCR package is PRIVATE. The first push succeeds, but an
# unauthenticated `docker pull` (e.g. from a cluster with no imagePullSecret)
# fails until the package is flipped to public once, under
# github.com/users/<owner>/packages → the package → Package settings → Change
# visibility. The org.opencontainers.image.source label set below links the
# package back to this repo.
name: ci-pipeline

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      # Directory globs, never per-file lists: listing individual .py files here
      # would silently miss pyproject.toml/uv.lock, so a dependency-only change
      # would not rebuild the image.
      - "app/**"
      # The desktop package at the repo root is IN the image: the web backend
      # depends on it as an editable path dependency and pswamp_web/ imports
      # pswamp.* (see AGENTS.md, "Two Python projects in one repo"). A change
      # under root src/ therefore changes what gets published, so it has to
      # trigger a rebuild — this used to be app/** only, back when the two
      # projects genuinely shared nothing.
      - "src/**"
      - "pyproject.toml"
      - "Dockerfile"
      - ".dockerignore"
      # Local-run infra for the Kafka-vs-NATS experiment. A change to how the
      # stack is composed or deployed should re-run the pipeline; both were
      # missing before that experiment added broker + producer services.
      - "docker-compose.yml"
      - "k8s/**"
      - "scripts/error_check.sh" # a change to the gate re-runs the gate
      - "scripts/e2e-smoke-test.sh" # …and so does a change to the other gate
      # The unit-test runner scripts are gates too, so a change to one re-runs CI.
      # (run-core-python-tests.sh is listed for when its step is re-enabled; it is
      # harmless while the step is commented out.)
      - "scripts/run-python-server-tests.sh"
      - "scripts/run-core-python-tests.sh"
      # The published api contract. error_check.sh verifies that these two
      # generated artifacts still match the code, so a change to either — or to
      # the script that produces them — has to re-run the gate. Note doc/ is
      # otherwise deliberately NOT a trigger: this is the one part of it that is
      # generated rather than written, and the one that can be wrong.
      - "doc/api/**"
      - "scripts/generate-api-contract.sh"
      # This file's own name: a filter listing a path that no longer exists fails
      # silently, by never re-running the pipeline for a change to the pipeline.
      - ".github/workflows/ci-pipeline.yml"

  # Deliberately NO paths filter here, unlike the push trigger above.
  #
  # `static-errorcheck` and `e2e-smoke-test` are required status checks on main, and
  # GitHub treats a required check that never ran as *pending*, not as passed — so
  # a PR whose files all fall outside a filter would sit "Expected — waiting for
  # status to be reported" and could never be merged. A path filter on the publish
  # side only decides whether to spend a build; on the merge-gate side it decides
  # whether a PR is mergeable at all, which is not a trade worth making. A
  # docs-only PR therefore pays for a (heavily cached) run rather than becoming
  # unmergeable.
  pull_request:

  # Lets you rebuild from the Actions tab without pushing a commit.
  workflow_dispatch:

# A new push to the same branch cancels the previous run — image builds are the
# expensive part here and only the newest commit's image is interesting.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # ghcr.io/<owner>/<repo> package, that local clusters can pull from.
  # GHCR requires an all-lowercase path and this repo's name is NOT
  # (p-SWAMP); docker/metadata-action lowercases the image name for the tags it
  # computes, which is what keeps the push valid. If a step is ever added that
  # uses IMAGE_NAME directly rather than through metadata-action, lowercase it
  # explicitly (e.g. with a small `tr` step) or the push fails with "invalid
  # reference format".
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # --- Static checks: the local pre-push gate, run again on the server --------
  static-errorcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # error_check.sh preflights exactly node, npx, uv and python3 and fails
      # fast if any is missing. python3 is already on ubuntu-latest; node, uv and
      # the 3.11 interpreter uv needs are set up below.
      #
      # Node 24 matches the Dockerfile's web-build stage — the web client must
      # type-check and lint on the same major it is built with.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/client-web/package-lock.json

      # `uv` (not `uvx`): error_check.sh runs ruff out of the locked `dev`
      # dependency group, so everyone — hook, CI, developer — runs the identical
      # linter version pinned in pyproject.toml.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: app/server-python/uv.lock

      # Python 3.11 specifically — matching app/server-python/.python-version and
      # the image's base. The runner ships a newer python3, which is fine for
      # py_compile but NOT for `uv lock --check`: that resolves against the
      # project's requires-python and needs a real 3.11 interpreter. The check
      # runs `--offline` (deliberate: it keeps the pre-push hook off the
      # network), so uv may not download one on demand — without this step it
      # fails with "No interpreter found for Python 3.11 … uv is set to offline
      # mode". Installing it here, before the offline check, is what satisfies
      # that.
      - name: Install Python 3.11 for uv
        run: uv python install 3.11

      # Installs node_modules itself on a cold checkout (see the script), so
      # there is no separate `npm ci` step to keep in sync with it.
      #
      # The api-contract check inside it imports the FastAPI app to regenerate
      # doc/api/openapi.json and diff it against the committed copy, so this step
      # also syncs the server's full dependency set — not just the pinned linter.
      # setup-uv's cache above is keyed on uv.lock, which is what keeps that from
      # being slow on every run.
      - name: Static checks (tsc, eslint, uv lock --check, py_compile, ruff, api contract)
        run: ./scripts/error_check.sh

  # --- Unit tests: the Python test suites, via their runner scripts -----------
  #
  # Runs the runner scripts rather than a bare `pytest` so CI and a developer
  # invoke the identical command — the same principle the static job follows with
  # error_check.sh. Gates the e2e-smoke-test/publish, so a failing test produces no
  # image.
  unit-tests:
    needs: static-errorcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # uv drives both suites' envs (the server project, and — once re-enabled —
      # the root desktop project). Cache keyed on the server lockfile, warm from
      # the static job that shares it.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: app/server-python/uv.lock
      - run: uv python install 3.11

      # The fast, hermetic server suite (app/server-python/tests/): HubRegistry is
      # driven with a stubbed Hub, so nothing binds a port. A cold run syncs the
      # server env first (warm from the shared cache above).
      - name: Server unit tests
        run: ./scripts/run-python-server-tests.sh

      # TODO Figure out why the existing tests are failing: the desktop "core"
      # suite (repo-root tests/) aborts at collection because
      # tests/test_run_simple_case_{kafka,nqkafka}.py import
      # pswamp.monitoring.utils.TimeWindowRTApp, a module removed from the package
      # (commit 15a3f7a "Removed unused TimeWindowRTApp") without updating its
      # importers. It also needs Kafka/NQKafka/MQTT brokers and a Qt display,
      # none of which this runner provides. Re-enable once the maintainer has
      # resolved the missing module and the infra-bound tests are skip-guarded(?)
      # - name: Core (desktop) unit tests
      #   run: ./scripts/run-core-python-tests.sh

  # --- Does the built image actually work? -----------------------------------
  #
  # error_check.sh above is entirely static and deliberately never starts the
  # app; this job is the other half — it ONLY starts the app. It runs the image
  # exactly as a cluster would (the Dockerfile's own CMD, no compose dev
  # overrides) and drives the Reference example end to end: REST commands up,
  # state down the socket. See scripts/e2e-smoke-test.sh for what it checks and why
  # that app is the one worth automating.
  #
  # It gates the publish, so a green image is one that has served a request.
  e2e-smoke-test:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # uv for the WebSocket half of the test: scripts/e2e-smoke-test.sh runs
      # tools/smoketest_reference_subapp.py in the server's own locked
      # environment, where `websockets` is already present via uvicorn[standard].
      # Nothing new to install, and the cache below is keyed on the same lockfile
      # the check job uses, so it is warm by the time this runs.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: app/server-python/uv.lock
      - run: uv python install 3.11

      # The same buildx cache the publish job writes, so this build is not paid
      # for twice: whichever job runs first populates type=gha and the other
      # mostly hits it. `load: true` puts the image in the runner's docker daemon
      # (amd64, which the runner is natively — no QEMU needed).
      - uses: docker/setup-buildx-action@v4
      - name: Build the image under test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: p-swamp:smoketest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # `docker run`, not `docker compose up`: compose overrides the command with
      # `uvicorn --reload` for local dev, which is not what ships. This runs the
      # image's own CMD.
      - name: Start the server
        run: |
          docker run -d --name p-swamp-smoketest \
            -p 8000:8000 -e HOST=0.0.0.0 -e PORT=8000 \
            p-swamp:smoketest

      # SMOKETEST_URL means "test this server, don't manage its lifecycle" — the
      # script still waits for /healthz before asserting anything, so there is no
      # sleep to tune here.
      - name: Smoke test the running image
        run: SMOKETEST_URL=http://127.0.0.1:8000 ./scripts/e2e-smoke-test.sh

      - name: Server log
        if: always()
        run: docker logs p-swamp-smoketest || true

      - name: Stop the server
        if: always()
        run: docker rm -f p-swamp-smoketest || true

  # --- Build the image and push it to GHCR ------------------------------------
  #
  # Skipped entirely on a pull request. It used to run there with `push: false`,
  # to prove the Dockerfile still built — but the e2e-smoke-test job above now builds
  # the very same image AND gets a response out of it, which is strictly more
  # than that proved. Running this too would just be a second build of an
  # artifact nothing would consume.
  build-and-push:
    needs: e2e-smoke-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for pushing to GHCR with the automatic GITHUB_TOKEN. No extra
      # secret is needed for ghcr.io.
      packages: write
    steps:
      - uses: actions/checkout@v5

      # buildx for the layer cache below (the plain builder can't export one).
      # No QEMU here: the published image is amd64 only, which the runner is
      # natively — see the `platforms` note on the build step.
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Computes the tag list and the standard OCI labels (including
      # org.opencontainers.image.source, which links the GHCR package to this
      # repo and makes it inherit the repo's visibility settings).
      #
      # Tags produced:
      #   latest             — only on the default branch
      #   <branch>           — e.g. main
      #   sha-<full sha>     — immutable, the one to pin a deployment to
      #   v1.2.3 / 1.2 / 1   — when a v* tag is pushed
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Build context is the repo root, matching docker-compose.yml (`build: .`)
      # and start-pswamp-in-local-minikube-cluster.sh — the Dockerfile's
      # web-build stage needs app/client-web/ in the context, so it cannot be
      # narrowed to app/server-python/.
      # amd64 only, deliberately: that is what the clusters run. Local dev boxes
      # here are often arm64, but they build their own image (compose /
      # minikube), never pull this one. Adding arm64 would mean emulating `npm
      # ci` + `vite build` + pip install through QEMU on every push, for an
      # artifact nothing consumes.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stamps the built frontend with the commit it came from: the Dockerfile's
          # web-build stage exposes this to Vite as VITE_GIT_SHA, which the footer
          # shows on deployed origins. Only the published image needs it — dev builds
          # (compose/minikube) run on localhost, where the footer hides it.
          build-args: |
            GIT_SHA=${{ github.sha }}
          # Layer cache in GitHub's own cache backend, so an unchanged
          # package-lock.json / uv.lock skips the two slow install layers.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Pushed image tags"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
