services:
  # Just "server": Compose prefixes containers with the project name, which is
  # already the repo directory (p-SWAMP), so this comes up as p-swamp-server-1
  # rather than repeating the name twice.
  server:
    build: .
    image: p-swamp:latest
    ports:
      - "8000:8000"
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      # Compose sync writes may not always emit inotify events in-container;
      # polling keeps reload reliable across host/container boundaries.
      WATCHFILES_FORCE_POLLING: "true"
      # The PMU test streamer's stats module runs in the stats-worker below,
      # reached over the kafka broker. Both sides read this one variable; unset
      # it and the module runs in this process instead (what CI's bare
      # `docker run` exercises).
      PMU_TEST_STREAMER_MODULE_TRANSPORT: "kafka:pswamp_core.transport.kafka:KafkaTransport"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      # The streamer's "Remote recording" source: the Remote Data Client asks
      # this remote data service (the stub below, standing in for a
      # deployment's own service over its own store) for each range and reads
      # the answer back as the streamed response. Unset, the source is simply
      # not offered (what CI's bare `docker run` does).
      REMOTE_DATA_URL: "http://remote-data-stub:8100"
    # A publish to a broker that is still booting is dropped, so wait for it;
    # the stub likewise, since a remote pipeline's first act is to ask it for coverage.
    depends_on:
      kafka:
        condition: service_healthy
      remote-data-stub:
        condition: service_healthy
    # Dev-only override: run uvicorn with --reload so the files synced in by
    # `watch` (below) trigger an in-process hot reload. The Dockerfile's prod
    # CMD (plain `python server.py`) is left untouched — this reloader never
    # ships, since compose is only used locally during dev.
    command:
      [
        "uvicorn",
        "server:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/workspace/p-SWAMP/app/server-python/src",
        "--reload-dir",
        "/workspace/p-SWAMP/src",
        "--reload-dir",
        "/workspace/p-SWAMP/core",
      ]
    # /healthz is the process's own health — "is it serving?". The broker is an
    # optional dependency of one module, reached lazily, not a precondition.
    # curl returns non-zero if the endpoint doesn't answer.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    # Live reload for dev, the server-side analog of the client's `entr -r`:
    # run `docker compose watch`, and on a save Compose copies the file into the
    # running container. No rebuild and no container restart — uvicorn's own
    # --reload watcher (see the command: override above) sees the new file and
    # hot-reloads the app in place. Pure `sync` works *because* of that watcher;
    # without it the file would land but the old code would keep running.
    develop:
      watch:
        # The whole source dir, not a file-by-file list: a new module — or a
        # whole new app package under src/ — is picked up without editing this
        # file. The image mirrors the repo
        # (the whole repo at /workspace/p-SWAMP, at its real depth — see the
        # Dockerfile), so the two sides of this path match.
        # .dockerignore applies here too, so __pycache__/ and a locally built
        # src/static/ are not synced in — importantly, the web client baked into
        # the image at <server dir>/src/static keeps being served during a watch
        # session.
        # Adds and edits propagate; a local *delete* does not (the file lingers
        # in the container until the next rebuild).
        - path: app/server-python/src
          action: sync
          target: /workspace/p-SWAMP/app/server-python/src
        # The same live-reload loop for the desktop package at the repo root.
        # p-swamp is installed editable (see the Dockerfile), so root src/pswamp/
        # in the image is what actually gets imported, and syncing it means a
        # change to a monitoring application or the time-window storage
        # hot-reloads here just like a change to the server's own code. Without
        # this, edits there would appear to do nothing until the next rebuild.
        - path: src
          action: sync
          target: /workspace/p-SWAMP/src
        # And the shared core (core/, installed editable the same way).
        - path: core
          action: sync
          target: /workspace/p-SWAMP/core
        # Dependency changes are the exception: new packages have to be
        # installed, which a file sync can't do. These rebuild the image and
        # recreate the container instead — slower, on purpose. Without this,
        # editing pyproject.toml would appear to do nothing.
        - path: app/server-python/pyproject.toml
          action: rebuild
        - path: app/server-python/uv.lock
          action: rebuild
        - path: core/pyproject.toml
          action: rebuild

  # The stats module as its own process (pmu_test_streamer/worker.py): the SAME
  # image, a different command, no port. It tails pmu.frame off the broker, runs
  # one FrameStatsModule per pipeline key it sees, and publishes
  # frame.stats.result back under that key. A plain python process has no
  # --reload, so the watch entries restart it on a sync.
  stats-worker:
    build: .
    image: p-swamp:latest
    command: ["python", "-m", "pmu_test_streamer.worker"]
    environment:
      PMU_TEST_STREAMER_MODULE_TRANSPORT: "kafka:pswamp_core.transport.kafka:KafkaTransport"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    depends_on:
      kafka:
        condition: service_healthy
    # No healthcheck: nothing routes to it. Its logs are the view: one line per
    # pipeline key started and evicted.
    restart: unless-stopped
    develop:
      watch:
        - path: app/server-python/src
          action: sync+restart
          target: /workspace/p-SWAMP/app/server-python/src
        - path: core
          action: sync+restart
          target: /workspace/p-SWAMP/core
        - path: app/server-python/pyproject.toml
          action: rebuild
        - path: app/server-python/uv.lock
          action: rebuild
        - path: core/pyproject.toml
          action: rebuild

  # A dummy remote data service behind the REST contract
  # (doc/remote-data-integration-contract.md): the SAME image, a different
  # command, standing where a deployment's own service would. Its "store" is
  # a three-second sample tiled to a minute (core/examples/remote_data_stub/,
  # outside the installed package, hence the PYTHONPATH). Not published to the
  # host: nothing outside the compose network needs it.
  remote-data-stub:
    build: .
    image: p-swamp:latest
    command: ["python", "-m", "remote_data_stub"]
    environment:
      PYTHONPATH: "/workspace/p-SWAMP/core/examples"
      REMOTE_DATA_STUB_REPEAT: "20"
    expose:
      - "8100"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8100/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    develop:
      watch:
        - path: core
          action: sync+restart
          target: /workspace/p-SWAMP/core
        - path: app/server-python/pyproject.toml
          action: rebuild
        - path: app/server-python/uv.lock
          action: rebuild
        - path: core/pyproject.toml
          action: rebuild

  # The broker between the server and the workers: Apache Kafka, one node in
  # KRaft mode. Ephemeral on purpose (no volume): everything on its topics is a
  # live hop, and a restart empties them at no cost. The EXTERNAL listener on
  # 19092 is for the host: the broker-gated transport test
  # (KAFKA_TEST_BOOTSTRAP_SERVERS=127.0.0.1:19092). Auto-creation is off: the
  # transport creates its topics itself (one partition, bounded retention).
  # The image turns every KAFKA_* variable into a server.properties entry.
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # One node, so every internal topic has one replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      # The transport creates topics with a minute's retention, but the broker
      # enforces it only on this interval (five minutes by default, enough for
      # a fast replay to fill the Docker VM's disk). Check every 10 s.
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: "10000"
      # A dev broker; the JVM would otherwise take a quarter of the machine.
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    ports:
      - "19092:19092"
    # The broker's own CLI asking for its api versions: a JVM start per probe.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s
    restart: unless-stopped
